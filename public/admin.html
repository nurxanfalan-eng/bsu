<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - BSU Chat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="adminLoginScreen" class="auth-box">
            <div class="logo">
                <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="60" height="60" rx="10" fill="#E63946"/>
                    <path d="M30 15L20 25V40H25V32H35V40H40V25L30 15Z" fill="white"/>
                </svg>
            </div>
            <h1>Admin Paneli</h1>
            
            <form id="adminLoginForm" class="auth-form">
                <div class="input-group">
                    <input type="text" id="adminUsername" placeholder="İstifadəçi adı" required>
                </div>
                <div class="input-group">
                    <input type="password" id="adminPassword" placeholder="Şifrə" required>
                </div>
                <button type="submit" class="btn-primary admin-btn">Daxil ol</button>
                <p class="toggle-link">
                    <a href="/">Çıxış</a>
                </p>
            </form>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" style="display: none;">
            <div class="admin-header">
                <h1>
                    <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
                        <rect width="60" height="60" rx="10" fill="#E63946"/>
                        <path d="M30 15L20 25V40H25V32H35V40H40V25L30 15Z" fill="white"/>
                    </svg>
                    Admin Paneli
                </h1>
                <button class="btn-secondary" onclick="adminLogout()">Çıxış</button>
            </div>

            <div class="admin-content">
                <div class="admin-tabs">
                    <button class="tab-btn active" onclick="showAdminTab('stats')">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 17V11H7V17H3ZM8 17V3H12V17H8ZM13 17V7H17V17H13Z" fill="currentColor"/>
                        </svg>
                        Statistika
                    </button>
                    <button class="tab-btn" onclick="showAdminTab('users')">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 10C12.21 10 14 8.21 14 6C14 3.79 12.21 2 10 2C7.79 2 6 3.79 6 6C6 8.21 7.79 10 10 10ZM10 12C7.33 12 2 13.34 2 16V18H18V16C18 13.34 12.67 12 10 12Z" fill="currentColor"/>
                        </svg>
                        İstifadəçilər
                    </button>
                    <button class="tab-btn" onclick="showAdminTab('rules')">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M4 4H16V6H4V4ZM4 8H16V10H4V8ZM4 12H12V14H4V12Z" fill="currentColor"/>
                        </svg>
                        Qaydalar
                    </button>
                    <button class="tab-btn" onclick="showAdminTab('topic')">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 2L12.5 7L18 8L14 12L15 18L10 15L5 18L6 12L2 8L7.5 7L10 2Z" fill="currentColor"/>
                        </svg>
                        Günün Mövzusu
                    </button>
                    <button class="tab-btn" onclick="showAdminTab('filter')">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 18H14V16H10V18ZM3 6V8H17V6H3ZM6 13H14V11H6V13Z" fill="currentColor"/>
                        </svg>
                        Filtr
                    </button>
                    <button class="tab-btn" onclick="showAdminTab('reported')">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 2L2 4V10C2 15 6 18.7 10 20C14 18.7 18 15 18 10V4L10 2ZM10 11H9V6H11V11ZM10 15H9V13H11V15Z" fill="currentColor"/>
                        </svg>
                        Şikayətlər
                    </button>
                    <button class="tab-btn" id="subAdminsTab" onclick="showAdminTab('subadmins')" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M14 10C15.1 10 16 9.1 16 8C16 6.9 15.1 6 14 6C12.9 6 12 6.9 12 8C12 9.1 12.9 10 14 10ZM6 10C7.1 10 8 9.1 8 8C8 6.9 7.1 6 6 6C4.9 6 4 6.9 4 8C4 9.1 4.9 10 6 10ZM6 12C4 12 0 13 0 15V17H12V15C12 13 8 12 6 12ZM14 12C13.7 12 13.4 12 13 12.1C14.2 13 15 14.2 15 15V17H20V15C20 13 16 12 14 12Z" fill="currentColor"/>
                        </svg>
                        Alt Adminlər
                    </button>
                </div>

                <!-- Statistics Tab -->
                <div id="statsTab" class="admin-tab-content">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                                <circle cx="20" cy="20" r="18" fill="#5B7FFF" opacity="0.1"/>
                                <path d="M20 20C23.31 20 26 17.31 26 14C26 10.69 23.31 8 20 8C16.69 8 14 10.69 14 14C14 17.31 16.69 20 20 20ZM20 22C15.33 22 6 24.34 6 29V32H34V29C34 24.34 24.67 22 20 22Z" fill="#5B7FFF"/>
                            </svg>
                            <h3>Ümumi İstifadəçilər</h3>
                            <p class="stat-number" id="totalUsers">0</p>
                        </div>
                        <div class="stat-card">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                                <circle cx="20" cy="20" r="18" fill="#06D6A0" opacity="0.1"/>
                                <path d="M15 26L10 21L11.41 19.59L15 23.17L28.59 9.58L30 11L15 26Z" fill="#06D6A0"/>
                            </svg>
                            <h3>Aktiv İstifadəçilər</h3>
                            <p class="stat-number" id="activeUsers">0</p>
                        </div>
                        <div class="stat-card">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                                <circle cx="20" cy="20" r="18" fill="#E63946" opacity="0.1"/>
                                <path d="M20 10L12 14V20C12 25 16 29.7 20 31C24 29.7 28 25 28 20V14L20 10ZM20 21H19V16H21V21ZM20 25H19V23H21V25Z" fill="#E63946"/>
                            </svg>
                            <h3>Şikayət Edilən Hesablar</h3>
                            <p class="stat-number" id="reportedCount">0</p>
                        </div>
                    </div>
                </div>

                <!-- Users Tab -->
                <div id="usersTab" class="admin-tab-content" style="display: none;">
                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Ad Soyad</th>
                                    <th>Email</th>
                                    <th>Telefon</th>
                                    <th>Fakültə</th>
                                    <th>Dərəcə</th>
                                    <th>Kurs</th>
                                    <th>Status</th>
                                    <th>Əməliyyatlar</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Rules Tab -->
                <div id="rulesTab" class="admin-tab-content" style="display: none;">
                    <div class="form-group">
                        <label>Qaydalar</label>
                        <textarea id="rulesTextarea" rows="15" placeholder="Qaydaları buraya yazın..."></textarea>
                        <button class="btn-primary" onclick="updateRules()">Yadda saxla</button>
                    </div>
                </div>

                <!-- Topic Tab -->
                <div id="topicTab" class="admin-tab-content" style="display: none;">
                    <div class="form-group">
                        <label>Günün Mövzusu</label>
                        <input type="text" id="topicInput" placeholder="Günün mövzusunu daxil edin..." />
                        <button class="btn-primary" onclick="updateTopic()">Yadda saxla</button>
                    </div>
                </div>

                <!-- Filter Tab -->
                <div id="filterTab" class="admin-tab-content" style="display: none;">
                    <div class="form-group">
                        <label>Filtr Sözləri (vergüllə ayırın)</label>
                        <input type="text" id="filterWordsInput" placeholder="spam, reklam, ..." />
                        <button class="btn-primary" onclick="updateFilterWords()">Yadda saxla</button>
                    </div>
                    <div class="form-group">
                        <label>Qrup Mesajları Silinmə Vaxtı (saat)</label>
                        <input type="number" id="groupExpiryInput" min="1" max="168" value="24" />
                    </div>
                    <div class="form-group">
                        <label>Şəxsi Mesajlar Silinmə Vaxtı (saat)</label>
                        <input type="number" id="privateExpiryInput" min="1" max="168" value="48" />
                        <button class="btn-primary" onclick="updateMessageExpiry()">Yadda saxla</button>
                    </div>
                </div>

                <!-- Reported Users Tab -->
                <div id="reportedTab" class="admin-tab-content" style="display: none;">
                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Ad Soyad</th>
                                    <th>Email</th>
                                    <th>Fakültə</th>
                                    <th>Şikayət Sayı</th>
                                    <th>Əməliyyatlar</th>
                                </tr>
                            </thead>
                            <tbody id="reportedTableBody">
                                <!-- Reported users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Sub Admins Tab -->
                <div id="subadminsTab" class="admin-tab-content" style="display: none;">
                    <div class="form-group">
                        <h3>Yeni Alt Admin Yarat</h3>
                        <input type="text" id="newAdminUsername" placeholder="İstifadəçi adı" />
                        <input type="password" id="newAdminPassword" placeholder="Şifrə" />
                        <button class="btn-primary" onclick="createSubAdmin()">Yarat</button>
                    </div>
                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>İstifadəçi adı</th>
                                    <th>Yaradılma tarixi</th>
                                    <th>Əməliyyatlar</th>
                                </tr>
                            </thead>
                            <tbody id="subAdminsTableBody">
                                <!-- Sub admins will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
